<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>enrydev</title>
    <meta name="description" content="Portfolio hacker in puro HTML, JS e CSS nativo senza Tailwind." />
    <meta property="og:title" content="Enrico // Cyber Portfolio - Studente Programmatore" />
    <meta property="og:description" content="Portfolio hacker in puro HTML, JS e CSS nativo senza Tailwind." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- 100% Pure CSS (No Tailwind CSS) -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="cyber-grid">
    <!-- Matrix Digital Rain Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <!-- CRT Scanlines & Vignette Filter Overlay -->
    <div id="crt-overlay" class="crt-overlay"></div>

    <!-- Main Content Container -->
    <div class="container">
      
      <!-- Top HUD Header -->
      <header class="header-bar">
        <div class="brand">
          <span class="brand-prompt">&gt;</span>
          <span class="brand-name scramble-target">enrydev.is-a.dev</span>
          <span class="cursor-blink"></span>
        </div>

        <div class="hud-controls">
          <div class="project-links">
                <a href="https://github.com/enry-dev/" target="_blank" rel="noopener noreferrer" class="link-btn">
                  <span>Account GitHub</span>
                </a>
              </div>

      </header>

      <!-- 2. I Miei Progetti & Link -->
      <section class="section-block">
        <div class="section-command" style="justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="cmd-prompt">$</span>
            <span class="scramble-target">Progetti</span>
          </div>
        </div>

        <div class="projects-list">
          <!-- Progetto 1 -->
          <article class="cyber-card project-item">
            <div class="project-header">
              <div class="project-title">
                <span class="meta-arrow">&gt;</span>
                <span class="glitch-hover">StarCity</span>
              </div>
              <div class="project-links">
                <a href="https://github.com/enry-dev/enry-dev.github.io/tree/main/starcity" target="_blank" rel="noopener noreferrer" class="link-btn">
                  <span>-> Codice GitHub</span>
                </a>
                <a href="https://enrydev.is-a.dev/starcity" target="_blank" rel="noopener noreferrer" class="link-btn">
                  <span>-> Sito Ufficiale</span>
                </a>
              </div>
            </div>

            <p class="project-desc">
              Un gioco open world ambientato in una città piena di opportunità e pericoli, con veicoli e luoghi da esplorare.
            </p>

            <div class="tech-meta">
              <span class="meta-val">Web</span>
              <span class="separator">·</span>
              <span class="meta-val">JavaScript</span>
              <span class="separator">·</span>
              <span class="meta-val">Three.js</span>
            </div>
          </article>
        </div>
      </section>

    </div>

    <!-- Pure Modern JavaScript -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
